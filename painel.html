<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https:">
<title>Multidle</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px system-ui;background:#1f1523;color:#f3e9f5;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;background:#9b4dca;color:#fff;border:0;border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{background:#b06ee0}
button:disabled{opacity:.4;cursor:not-allowed;background:#9b4dca}

/* Barra própria no lugar da moldura do Windows: arrasta a janela, botões não */
header{display:flex;align-items:center;gap:8px;height:36px;padding-left:12px;background:#160f19;-webkit-app-region:drag;flex:none}
header button{-webkit-app-region:no-drag}
.titulo{font-weight:700;color:#c9a8d4;margin-right:8px}
.acoes{display:flex;gap:6px;flex:1}
.ctl{display:flex;height:100%}
.ctl button{background:none;border-radius:0;width:46px;height:100%;color:#c9a8d4;font-size:14px}
.ctl button:hover{background:#2f2134}
.ctl .x:hover{background:#c42b3c;color:#fff}

main{flex:1;min-height:0;padding:8px}
#t{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px}
.inicio{grid-column:1/-1;margin:auto;text-align:center;color:#a98bb3;line-height:1.6}
.card{background:#2f2134;border:1px solid #4a3550;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.card.fechado{cursor:pointer}
.card.fechado:hover{border-color:#b06ee0;background:#382740}
.topo{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 12px;flex:none}
.nome{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.jogo{font-size:11px;color:#a98bb3;font-weight:400}
.tempo{color:#a98bb3;font-variant-numeric:tabular-nums}
.card.alerta{border-color:#e0475a;box-shadow:0 0 0 1px #e0475a inset}
.estado{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;white-space:nowrap}
.estado::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
.estado.ok{color:#6ee08a}.estado.alerta{color:#ff6b7a}
.estado .extra{color:#a98bb3;font-weight:400}
.bts{display:flex;gap:4px}
.bts button{padding:2px 8px;background:#4a3550}
.bts button:hover{background:#9b4dca}
.bts .remover:hover{background:#c42b3c}
.corpo{flex:1;min-height:0;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px;overflow:auto}

.linha-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.sub-t{color:#c9a8d4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selos{display:flex;gap:6px;flex:none}
.selo{font-size:12px;color:#a98bb3;background:#1d1421;border:1px solid #4a3550;border-radius:6px;padding:1px 7px;white-space:nowrap}
.selo b{font-variant-numeric:tabular-nums}
.selo.ouro b{color:#ffd166}.selo.diam b{color:#7fd7ff}.selo.gema b{color:#ff7bd5}

/* Blocos no estilo dos jogos: rótulo pequeno, valor grande, ritmo por hora colorido */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:6px}
.kpi,.bloco{background:#1d1421;border:1px solid #4a3550;border-radius:8px;padding:6px 9px;min-width:0}
.kpi .rot,.bloco h4{margin:0;color:#c9a8d4;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.kpi .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .h{font-size:12px;font-weight:700;color:#ff7bb0;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11px;color:#a98bb3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neg{color:#ff6b7a !important}.pos{color:#6ee08a !important}

.blocos{display:grid;gap:6px}
.bloco h4{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#2f2134;border:1px solid #4a3550;border-radius:999px;padding:2px 8px;font-size:12px;white-space:nowrap}
.chip b{color:#ffd166;font-variant-numeric:tabular-nums}
.item{display:inline-flex;align-items:center;gap:4px;background:#2f2134;border:1px solid #4a3550;border-radius:6px;padding:2px 7px 2px 3px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.item img{width:20px;height:20px;image-rendering:pixelated}
.item.destaque{border-color:#9b4dca}
.item.apagado{opacity:.35}
.linha{display:flex;justify-content:space-between;gap:6px;font-size:12px;padding:1px 0}
.linha span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha .fraco{color:#a98bb3;font-variant-numeric:tabular-nums;flex:none}
.linha.destaque,.linha.destaque .fraco{color:#ffd166;font-weight:700}
.vazio{color:#7d6585;font-size:12px}
.aviso{margin:auto;text-align:center;color:#a98bb3;display:flex;flex-direction:column;gap:8px;align-items:center}

/* Ferramenta do jogo em modal por cima do painel (a página da ferramenta é desenhada em #modal-corpo) */
#fundo{position:fixed;inset:36px 0 0 0;background:rgba(10,6,12,.7);display:flex;align-items:center;justify-content:center}
#fundo[hidden]{display:none}
#modal{width:min(1200px,92%);height:90%;background:#160f19;border:1px solid #9b4dca;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#modal-cab{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;flex:none;border-bottom:1px solid #4a3550}
#modal-titulo{flex:1;font-weight:700;color:#c9a8d4}
#modal-corpo{flex:1;min-height:0}
#modal.pequeno{width:min(480px,92%);height:auto;max-height:90%}
#modal.pequeno #modal-corpo{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;line-height:1.5}

.apoiar{background:none;color:#ff7bb0;border:1px solid #4a3550;margin-right:6px}
.selo.twitch b{color:#b48cff}
.bonus{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.bonus .rot{color:#a98bb3;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-right:2px}
.bonus .chip{font-size:11px;padding:1px 7px}
.bonus .chip b{color:#6ee08a}
#modal.depot{width:min(760px,94%)}
table.depot{width:100%;border-collapse:collapse;font-size:13px}
table.depot th{color:#c9a8d4;font-size:11px;text-transform:uppercase;text-align:left;padding:4px 6px;border-bottom:1px solid #4a3550}
table.depot td{padding:4px 6px;border-bottom:1px solid #2f2134;font-variant-numeric:tabular-nums}
table.depot tr.guardado{opacity:.45}
table.depot button{padding:2px 8px}
.depot-rodape{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
#modal.lives #modal-corpo{display:flex;flex-direction:column;gap:8px;padding:8px}
.lives-barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#c9a8d4;font-size:12px;flex:none}
.lives-barra label{display:flex;align-items:center;gap:6px;font-weight:700;color:#f3e9f5;cursor:pointer}
.lives-grade{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));grid-auto-rows:1fr;gap:6px}
.live{display:flex;flex-direction:column;border:1px solid #4a3550;border-radius:8px;overflow:hidden;min-height:0}
.live-cab{display:flex;justify-content:space-between;gap:6px;padding:3px 8px;font-size:12px;font-weight:700;background:#1d1421;flex:none}
.live-corpo{flex:1;min-height:0}
.atualizar{background:#2e7d4f;margin-right:6px}
.atualizar:hover{background:#3a9a62}
.apoiar:hover{background:#2f2134}
.apoio-caixa{background:#1d1421;border:1px solid #4a3550;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.apoio-caixa h4{margin:0;color:#c9a8d4;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.pix{display:flex;gap:6px;align-items:center}
.pix-qr svg{display:block;width:170px;height:170px;margin:0 auto;border-radius:6px}
.pix code{flex:1;background:#2f2134;border-radius:6px;padding:4px 8px;font-size:12px;word-break:break-all}
.apoio-links{display:flex;flex-direction:column;gap:4px}
a{color:#b48cff}
.fraco{color:#a98bb3;font-size:12px}
#modal.sniper{width:min(900px,94%)}
#modal.sniper #modal-corpo{overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:10px}
table.depot input[type=number]{width:110px}
.sniper-registro{font-size:12px;font-family:Consolas,monospace;background:#1d1421;border:1px solid #4a3550;border-radius:8px;padding:6px 8px;min-height:140px;max-height:260px;overflow:auto;flex:none}
.sniper-registro td{white-space:nowrap}.sniper-registro td:last-child{white-space:normal}
/* Aviso na barra de cima (as contas abertas cobrem o resto da tela, a barra não) */
.notificacao{background:#1f5c35;color:#d9ffe4;border:1px solid #3fa462;border-radius:14px;padding:3px 12px;font-size:13px;margin-right:6px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;-webkit-app-region:no-drag}
.selo-n{background:#3fa462;color:#fff;border-radius:9px;font-size:11px;padding:0 5px;margin-left:4px}
#modal.compras{width:min(760px,94%)}
#modal.compras #modal-corpo{overflow:auto;padding:10px 14px}
</style>
</head>
<body>
<header>
  <span class="titulo">Multidle</span>
  <span class="acoes">
    <button id="voltar" hidden>← Painel</button>
    <button id="todas">Mostrar todas</button>
    <button id="esconder">Esconder todas</button>
    <button id="resetar-todas" title="Zera a sessão de todas as contas (XP, lucro, abates...), como o Reset de cada cartão">&#x21BA; Resetar todas</button>
    <button id="recarregar-todas" title="Recarrega o jogo de todas as contas (como o F5), uma de cada vez: ajuda quando as telas travam no carregamento">&#x27F3; Recarregar contas</button>
    <span id="novas" class="acoes" style="flex:none"></span>
  </span>
  <button id="atualizar" class="atualizar" hidden></button>
  <span id="notificacao" class="notificacao" hidden></span>
  <button id="sniper" class="apoiar" title="Sniper do Mercado: compra anúncios abaixo do preço que você definir">&#x1F3AF; Sniper</button>
  <button id="compras" class="apoiar" title="Compras do Sniper">&#x1F514;<span id="compras-n" class="selo-n" hidden></span></button>
  <button id="lives" class="apoiar" title="Lives com bônus de XP" hidden>&#x1F4FA; Lives</button>
  <button id="apoiar" class="apoiar" title="Apoie o Multidle (opcional)">&#x2665; Apoiar</button>
  <span class="ctl">
    <button data-jan="min" title="Minimizar">&#x2013;</button>
    <button data-jan="max" title="Maximizar">&#x2610;</button>
    <button data-jan="fechar" class="x" title="Fechar">&#x2715;</button>
  </span>
</header>
<main id="area"><div id="t"></div></main>
<div id="fundo" hidden><div id="modal"><div id="modal-cab"><span id="modal-titulo"></span><button id="modal-fechar" title="Fechar">&#x2715;</button></div><div id="modal-corpo"></div></div></div>
<script>
// Cartão que cada módulo de jogo devolve (jogos/*.js, função montar):
// { nome, subtitulo, tempo, estado?: {texto, nivel: ok|alerta, dica, extra}, alerta, dicaSemKpis?, bonus?: [{rot, v}], selos: [{rot, v, cor}], kpis: [{rot, v, h, sub, cor}],
//   blocos: [{titulo, largo?, vazio?, etiqueta?: {rot, n}, itens?: [{ico ou rot, n, nome, destaque?, apagado?}],
//             linhas?: [{esq, meio?, dir, destaque?}]}], pronto, ferramenta }
// Apoio (opcional): troque `pix` pela chave do projeto (de preferência aleatória)
const APOIO = {

  pixQr: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45" shape-rendering="crispEdges"><path fill="#ffffff" d="M0 0h45v45H0z"/><path stroke="#000000" d="M2 2.5h7m6 0h2m1 0h2m1 0h2m3 0h1m1 0h2m2 0h1m3 0h7M2 3.5h1m5 0h1m2 0h1m1 0h2m1 0h4m2 0h1m1 0h1m1 0h1m2 0h2m1 0h1m3 0h1m5 0h1M2 4.5h1m1 0h3m1 0h1m1 0h4m5 0h3m1 0h1m1 0h2m1 0h2m2 0h1m3 0h1m1 0h3m1 0h1M2 5.5h1m1 0h3m1 0h1m1 0h1m1 0h2m2 0h3m3 0h2m1 0h1m4 0h1m1 0h1m1 0h1m1 0h1m1 0h3m1 0h1M2 6.5h1m1 0h3m1 0h1m1 0h2m1 0h1m3 0h1m2 0h2m1 0h1m1 0h2m1 0h1m3 0h1m3 0h1m1 0h3m1 0h1M2 7.5h1m5 0h1m1 0h1m2 0h4m1 0h1m1 0h1m4 0h1m5 0h2m1 0h1m1 0h1m5 0h1M2 8.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M10 9.5h2m1 0h3m1 0h2m1 0h1m3 0h3m1 0h4m1 0h1M2 10.5h1m1 0h5m3 0h1m1 0h1m1 0h1m1 0h2m1 0h1m1 0h1m1 0h1m1 0h2m1 0h1m1 0h1m1 0h1m1 0h5M3 11.5h1m2 0h2m1 0h2m3 0h3m3 0h1m1 0h2m1 0h1m2 0h1m2 0h1m3 0h2m1 0h1m3 0h1M3 12.5h1m1 0h1m2 0h1m1 0h2m1 0h1m1 0h3m2 0h1m1 0h1m7 0h1m1 0h1m1 0h1m1 0h1m1 0h1m2 0h1M5 13.5h1m1 0h1m3 0h2m3 0h4m3 0h1m2 0h3m2 0h3m1 0h1m5 0h1M2 14.5h5m1 0h4m1 0h3m1 0h1m2 0h1m1 0h2m8 0h1m1 0h1m1 0h3m2 0h1M2 15.5h1m2 0h2m3 0h1m5 0h1m1 0h1m4 0h2m1 0h1m1 0h1m1 0h1m2 0h2m1 0h1m3 0h1m1 0h1M2 16.5h5m1 0h1m5 0h2m3 0h1m2 0h2m8 0h1m2 0h2m1 0h1m1 0h2M3 17.5h3m3 0h1m1 0h2m2 0h4m4 0h2m3 0h1m1 0h1m1 0h1m2 0h1m1 0h1M2 18.5h1m2 0h1m1 0h2m3 0h1m2 0h2m1 0h2m2 0h2m1 0h2m2 0h3m3 0h1m2 0h1m2 0h1M3 19.5h1m2 0h1m4 0h1m1 0h1m1 0h4m2 0h1m3 0h1m5 0h2m2 0h1m1 0h1m3 0h2M3 20.5h2m2 0h2m2 0h7m2 0h1m1 0h1m1 0h3m2 0h1m1 0h4m2 0h2m1 0h3M3 21.5h2m2 0h1m1 0h2m2 0h6m2 0h2m3 0h2m1 0h2m1 0h1m2 0h2m3 0h1M2 22.5h1m2 0h6m1 0h1m1 0h3m3 0h1m1 0h3m2 0h2m1 0h1m1 0h5m1 0h2m1 0h1M5 23.5h3m1 0h1m5 0h1m1 0h3m3 0h1m2 0h1m2 0h1m2 0h2m2 0h2m3 0h1M7 24.5h4m5 0h1m4 0h1m5 0h1m1 0h2m1 0h2m1 0h3m2 0h3M3 25.5h2m1 0h2m1 0h2m1 0h1m1 0h1m1 0h1m1 0h3m1 0h3m1 0h1m1 0h2m4 0h3m5 0h1M4 26.5h1m1 0h3m2 0h1m3 0h1m1 0h1m1 0h1m1 0h1m1 0h3m3 0h3m1 0h3m2 0h1m2 0h1M2 27.5h4m4 0h1m1 0h1m1 0h2m2 0h2m3 0h1m2 0h1m1 0h1m1 0h1m2 0h2m1 0h1m4 0h1M4 28.5h1m1 0h5m1 0h5m1 0h4m2 0h1m2 0h5m4 0h1m1 0h5M3 29.5h1m1 0h2m2 0h1m1 0h3m1 0h1m4 0h1m4 0h3m3 0h2m2 0h1m2 0h1m3 0h1M2 30.5h3m1 0h6m2 0h1m1 0h2m1 0h2m2 0h1m1 0h2m3 0h1m1 0h1m2 0h4m1 0h2M2 31.5h1m1 0h3m2 0h1m1 0h2m6 0h1m2 0h1m1 0h6m1 0h1m3 0h1m2 0h3m1 0h1M2 32.5h1m1 0h2m2 0h1m2 0h2m1 0h3m2 0h1m1 0h1m2 0h1m1 0h2m1 0h1m1 0h2m7 0h3M2 33.5h1m4 0h1m3 0h2m1 0h2m1 0h1m2 0h3m1 0h1m2 0h1m1 0h1m2 0h1m3 0h1m1 0h1M2 34.5h1m1 0h3m1 0h3m1 0h6m3 0h1m2 0h2m2 0h1m3 0h10M10 35.5h2m4 0h9m3 0h1m1 0h1m2 0h2m3 0h1m1 0h1M2 36.5h7m4 0h7m1 0h3m2 0h2m2 0h1m1 0h1m1 0h1m1 0h1m1 0h1m2 0h1M2 37.5h1m5 0h1m1 0h2m1 0h1m2 0h1m2 0h2m2 0h2m1 0h2m3 0h2m1 0h1m3 0h1m1 0h2M2 38.5h1m1 0h3m1 0h1m1 0h1m1 0h1m1 0h1m3 0h1m3 0h2m3 0h5m1 0h8M2 39.5h1m1 0h3m1 0h1m1 0h2m1 0h1m2 0h1m1 0h3m3 0h1m1 0h1m1 0h1m5 0h2m2 0h1m1 0h2M2 40.5h1m1 0h3m1 0h1m1 0h1m2 0h1m1 0h4m1 0h2m3 0h3m1 0h1m1 0h6m1 0h1m1 0h2M2 41.5h1m5 0h1m2 0h2m1 0h1m1 0h5m3 0h1m3 0h1m4 0h1m1 0h1m1 0h2M2 42.5h7m1 0h1m3 0h1m3 0h4m1 0h3m4 0h3m1 0h2m1 0h5"/></svg>',
  sponsors: 'https://github.com/sponsors/Gustavoabreu94',
  repositorio: 'https://github.com/Gustavoabreu94/multidle',
};

const abertas = new Set(); // contas com o jogo visível por cima do cartão
let maximizada = null;     // conta ocupando o programa inteiro
let modal = null;          // ferramenta aberta em modal ('__ferramenta:<jogo>')
let contas = [];
let jogos = [];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => '&#' + c.charCodeAt(0) + ';');
const num = (n) => Number(n).toLocaleString('pt-BR');
const caixa = (r) => ({ x: Math.round(r.left), y: Math.round(r.top), width: Math.round(r.width), height: Math.round(r.height) });
const jogoDe = (id) => jogos.find((j) => j.id === id);

// Diz ao programa onde desenhar cada conta: no corpo do cartão, ou na área toda se maximizada
function layout() {
  const mapa = {};
  // Com o modal aberto só ele aparece: as contas abertas ficariam por cima dele. Elas continuam
  // marcadas como abertas e voltam do mesmo jeito ao fechar.
  $('#fundo').hidden = !modal;
  if (modal === 'lives') for (const el of document.querySelectorAll('.live-corpo')) mapa['__live:' + el.dataset.live] = caixa(el.getBoundingClientRect());
  else if (modal) mapa[modal] = caixa($('#modal-corpo').getBoundingClientRect());
  else if (maximizada) {
    const area = $('#area').getBoundingClientRect();
    mapa[maximizada] = caixa(area);
    // "Voltar ao painel" no centro do topo da conta maximizada (por cima da borda vazia do jogo)
    mapa.__voltar = { x: Math.round(area.left + area.width / 2 - 75), y: Math.round(area.top), width: 150, height: 24 };
  }
  else for (const c of abertas) {
    const el = document.querySelector(`.card[data-conta="${c}"] .corpo`);
    if (el) mapa[c] = caixa(el.getBoundingClientRect());
  }
  window.api.layout(mapa);
  $('#voltar').hidden = !maximizada;
}

const kpi = (k) => `<div class="kpi"><div class="rot">${esc(k.rot)}</div><div class="v ${esc(k.cor)}">${esc(k.v)}</div>`
  + `<div class="h ${esc(k.cor)}">${esc(k.h)}</div><div class="sub">${esc(k.sub)}</div></div>`;

function bloco(b) {
  const etiqueta = b.etiqueta ? `<span class="chip">${esc(b.etiqueta.rot)} <b>${num(b.etiqueta.n)}</b></span>` : '';
  const itens = (b.itens || []).map((i) => `<span class="item ${i.destaque ? 'destaque' : ''} ${i.apagado ? 'apagado' : ''}" title="${esc(i.nome)}">`
    + `${i.ico ? `<img src="${esc(i.ico)}" alt="">` : `<span class="fraco">${esc(i.rot)}</span>`}${num(i.n)}</span>`).join(''); // sem imagem (ex.: shiny): o rótulo
  const linhas = (b.linhas || []).map((l) => `<div class="linha ${l.destaque ? 'destaque' : ''}">`
    + `<span>${l.destaque ? '★ ' : ''}${esc(l.esq)} <span class="fraco">${esc(l.meio)}</span></span><span class="fraco">${esc(l.dir)}</span></div>`).join('');
  const conteudo = etiqueta || itens ? `<div class="chips">${etiqueta}${itens}</div>` : linhas || `<div class="vazio">${esc(b.vazio)}</div>`;
  return `<div class="bloco"><h4>${esc(b.titulo)}</h4>${conteudo}</div>`;
}

function detalhes(c) {
  const selos = (c.selos || []).map((s) => `<span class="selo ${esc(s.cor)}" title="${esc(s.rot)} (total da conta)">${esc(s.rot)} <b>${esc(s.v)}</b></span>`).join('');
  const blocos = c.blocos || [];
  const colunas = blocos.map((b) => (b.largo ? '1.4fr' : '1fr')).join(' ');
  // Sem os blocos da sessão (no PokeIdle, fora do Modo Economia): avisa em vez de deixar o espaço vazio
  const kpis = c.kpis?.length
    ? `<div class="kpis">${c.kpis.map(kpi).join('')}</div>`
    : c.dicaSemKpis ? `<div class="bloco vazio">${esc(c.dicaSemKpis)}</div>` : '';
  // Bônus valendo agora (VIP, Guild, Twitch, Kick...) com o tempo restante
  const bonus = c.bonus?.length
    ? `<div class="bonus"><span class="rot">Bônus</span>${c.bonus.map((b) => `<span class="chip">${esc(b.rot)} <b>${esc(b.v)}</b></span>`).join('')}</div>` : '';
  return `<div class="linha-sub"><span class="sub-t">${esc(c.subtitulo)}</span><span class="selos">${selos}</span></div>`
    + bonus + kpis
    + `<div class="blocos" style="grid-template-columns:${colunas}">${blocos.map(bloco).join('')}</div>`;
}

function render() {
  // Limite de contas de cada jogo (no PokeIdle, mais de 4 bane todas)
  for (const b of document.querySelectorAll('[data-nova]')) {
    const j = jogoDe(b.dataset.nova);
    const cheio = contas.filter((c) => c.jogo === j.id).length >= j.maxContas;
    b.disabled = cheio;
    b.title = cheio ? j.avisoLimite : '';
  }
  if (!contas.length) {
    $('#t').innerHTML = '<div class="inicio">Nenhuma conta ainda.<br>Clique em <b>+ Nova conta</b>: o navegador abre para você entrar no jogo,<br>'
      + 'e a conta aparece aqui sozinha quando o login terminar.</div>';
    return layout();
  }
  $('#t').innerHTML = contas.map((c) => {
    const jogo = jogoDe(c.jogo);
    const aberta = abertas.has(c.conta);
    const corpo = c.semNavegador && !c.pronto
      ? '<div class="aviso">Para entrar é preciso o Google Chrome ou o Microsoft Edge instalado.</div>'
      : c.entrando
      ? '<div class="aviso">Faça login na janela do navegador que abriu.<br>Quando o jogo abrir logado, feche a janela.</div>'
      : !c.pronto
      ? `<div class="aviso">Sem login ou carregando...<button data-entrar="${esc(c.conta)}">Entrar com Google</button></div>`
      : detalhes(c);
    const ferramenta = c.ferramenta && jogo?.ferramenta
      ? `<button data-ferramenta="${esc(c.conta)}" title="${esc(jogo.ferramenta.dica)}">${esc(jogo.ferramenta.rotulo)}</button>` : '';
    const acoes = (c.pronto ? (jogo?.acoes ?? []).map((a) => `<button data-acao="${esc(a.id)}" data-acao-conta="${esc(c.conta)}" title="${esc(a.dica)}">${esc(a.rotulo)}</button>`).join('') : '')
      + (c.pronto && jogo?.depot ? `<button data-depot="${esc(c.conta)}" title="Ver o Depot, guardar na Coleção e vender o resto">Depot</button>` : '');
    const bts = `<span class="bts">${acoes}${ferramenta}` + (aberta
      ? `<button data-max="${esc(c.conta)}" title="Ocupar o programa todo">&#x2922;</button><button data-fechar="${esc(c.conta)}" title="Esconder">&#x2013;</button>`
      : (c.pronto ? `<button data-max="${esc(c.conta)}" title="Abrir já ocupando o programa todo">&#x2922;</button>` : '')
        + `<button class="remover" data-remover="${esc(c.conta)}" title="Remover esta conta do Multidle">&#x2715;</button>`) + '</span>';
    // Estado da caça: "Caçando" ou "Parado" (borda vermelha); o motivo do jogo fica na dica
    const estado = c.estado && c.pronto
      ? `<span class="estado ${esc(c.estado.nivel)}" title="${esc(c.estado.dica)}">${esc(c.estado.texto)}`
        + (c.estado.extra ? ` <span class="extra">· ${esc(c.estado.extra)}</span>` : '') + '</span>'
      : '';
    return `<div class="card ${aberta ? '' : 'fechado'} ${c.alerta && c.pronto ? 'alerta' : ''}" data-conta="${esc(c.conta)}" title="${aberta ? '' : 'Abrir esta conta'}">`
      + `<div class="topo"><span class="nome">${esc(c.nome || c.conta)} <span class="jogo">${esc(jogo?.nome)}</span></span>${estado}<span class="tempo">${esc(c.tempo)}</span>${bts}</div>`
      + `<div class="corpo">${corpo}</div></div>`;
  }).join('');
  layout();
}

$('#t').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b?.dataset.entrar) return window.api.entrar(b.dataset.entrar);
  if (b?.dataset.ferramenta) return escolherParaFerramenta(contas.find((c) => c.conta === b.dataset.ferramenta), b);
  if (b?.dataset.acao) {
    const c = contas.find((x) => x.conta === b.dataset.acaoConta);
    const a = jogoDe(c.jogo)?.acoes.find((x) => x.id === b.dataset.acao);
    if (a && (!a.confirmar || confirm(`${c.nome || c.conta}: ${a.confirmar}`))) window.api.acao(c.conta, a.id);
    return;
  }
  if (b?.dataset.depot) return abrirDepot(b.dataset.depot);
  if (b?.dataset.max) { maximizada = b.dataset.max; return layout(); }
  if (b?.dataset.fechar) { abertas.delete(b.dataset.fechar); return render(); }
  if (b?.dataset.remover) {
    const c = contas.find((x) => x.conta === b.dataset.remover);
    if (confirm(`Remover ${c.nome || c.conta} do Multidle? O login dela neste computador é apagado (a conta no jogo não muda).`)) window.api.remover(c.conta);
    return;
  }
  const card = e.target.closest('.card.fechado');
  if (card) { abertas.add(card.dataset.conta); render(); }
});
$('#voltar').onclick = () => { maximizada = null; layout(); };
window.api.aoVoltar(() => { maximizada = null; layout(); });
$('#todas').onclick = () => { maximizada = null; contas.forEach((c) => abertas.add(c.conta)); render(); };
// O Reset de cada cartão, em todas as contas prontas, com uma confirmação só
$('#resetar-todas').onclick = async (e) => {
  const alvo = contas.filter((c) => c.pronto && jogoDe(c.jogo)?.acoes?.some((a) => a.id === 'reset'));
  if (!alvo.length || !confirm(`Zerar a sessão de ${alvo.length} conta(s)? XP, lucro, abates, capturas e achados da sessão voltam a 0 (as contas e os itens não mudam).`)) return;
  e.target.disabled = true;
  for (const c of alvo) await window.api.acao(c.conta, 'reset');
  e.target.disabled = false;
};
$('#esconder').onclick = () => { maximizada = null; abertas.clear(); render(); };
// Recarrega o jogo de todas as contas (como o F5), uma de cada vez
$('#recarregar-todas').onclick = async (e) => {
  if (!contas.length || !confirm(`Recarregar o jogo de ${contas.length} conta(s)? Uma de cada vez, leva alguns segundos por conta. As contas continuam logadas.`)) return;
  const b = e.target;
  b.disabled = true; b.textContent = 'Recarregando...';
  await window.api.recarregarContas();
  b.disabled = false; b.innerHTML = '&#x27F3; Recarregar contas';
};

// Venda do Depot: o jogo abre a confirmação dele (escondida), o Multidle mostra o que ela diz e a
// resposta do usuário vai para ela. Nada é vendido sem o "OK" aqui.
async function venderDepot(conta, botao) {
  const c = contas.find((x) => x.conta === conta);
  const rotulo = botao.textContent;
  botao.disabled = true; botao.textContent = 'Lendo o Depot...';
  const r = await window.api.vendaPreparar(conta);
  botao.disabled = false; botao.textContent = rotulo;
  if (r.erro) return alert(`${c.nome || conta}: ${r.erro}`);
  if (r.nada) return alert(`${c.nome || conta}: ${r.info || 'nada para vender no Depot.'}`);
  const valiosos = r.valiosos?.length ? `\n\n⚠ ATENÇÃO: o lote inclui ${r.valiosos.length} shiny/P5:\n- ${r.valiosos.join('\n- ')}` : '';
  const filtro = /filtr/i.test(r.titulo) ? '\n\n(O Depot está com filtro: vende só o que passa no filtro.)' : '';
  const sim = confirm(`${c.nome || conta} — ${r.titulo}\n\n${r.info}${filtro}${valiosos}\n\nA Coleção fica de fora. Não dá para desfazer. Vender?`);
  return (await window.api.vendaConcluir(conta, sim)) && sim;
}

// Depot: lista com os dados da ficha (do melhor para o pior pela nota), "→ Coleção" em cada um (sai da
// venda) e "Vender o resto" pela confirmação do jogo
async function abrirDepot(conta, aposVenda = false) {
  const c = contas.find((x) => x.conta === conta);
  abrirModal(`Depot · ${c.nome || conta}`, '<div class="fraco">Lendo o Depot (abre a ficha de cada Pokémon, alguns segundos)...</div>', true);
  $('#modal').classList.add('depot');
  modal = 'depot';
  layout();
  const r = await window.api.depotListar(conta);
  if (modal !== 'depot') return; // fechou enquanto lia
  if (r.erro) return void ($('#modal-corpo').innerHTML = `<div class="neg">${esc(r.erro)}</div>`);
  const num = (s) => Number(String(s).replace(/\./g, '').replace(',', '.')) || 0;
  const lista = r.lista.sort((a, b) => num(b.nota) - num(a.nota));
  // vendeu tudo: não sobrou Pokémon para mostrar, fecha o Depot
  if (aposVenda && !lista.length) { modal = null; layout(); return notificar(`${c.nome || conta}: Depot vendido, nenhum Pokémon sobrou.`); }
  const linhas = lista.map((p) => `<tr data-chave="${esc(p.chave)}">`
    + `<td>${p.shiny ? '✨ ' : ''}<b>${esc(p.nome)}</b> <span class="fraco">Nv${esc(p.nv)}</span>${p.novo ? ' <span class="pos">novo</span>' : ''}</td>`
    + `<td class="${p.potencia === 'P5' ? 'pos' : ''}">${esc(p.potencia)}</td><td>${esc(p.iv)}</td><td>${esc(p.qualidade)}</td>`
    + `<td><b>${esc(p.nota)}</b> <span class="fraco">${esc(p.faixa)}</span></td>`
    + `<td><button data-guardar="${esc(p.chave)}" title="Enviar para a Coleção: sai da venda">→ Coleção</button></td></tr>`).join('');
  $('#modal-corpo').innerHTML = lista.length
    ? `<table class="depot"><thead><tr><th>Pokémon</th><th>Pot.</th><th>IV</th><th>Qual.</th><th>Nota</th><th></th></tr></thead><tbody>${linhas}</tbody></table>`
      + `<div class="depot-rodape"><span class="fraco">${esc(r.venda)}</span><button id="depot-vender">Vender o resto</button></div>`
    : '<div class="fraco">O Depot está vazio.</div>';
  $('#modal-corpo').onclick = async (e) => {
    const b = e.target.closest('button');
    if (b?.dataset.guardar) {
      b.disabled = true;
      const ok = await window.api.depotGuardar(conta, b.dataset.guardar);
      b.textContent = ok ? 'Na Coleção ✓' : 'Não deu';
      b.closest('tr').classList.toggle('guardado', ok);
    }
    if (b?.id === 'depot-vender' && await venderDepot(conta, b)) abrirDepot(conta, true); // relê depois da venda
  };
}

// Com mais de uma opção (no PokeIdle, a equipe), escolhe antes com qual a ferramenta roda
function escolherParaFerramenta(c, botao) {
  const opcoes = Array.isArray(c.ferramenta) ? c.ferramenta : [];
  if (opcoes.length < 2) return abrirFerramenta(c.jogo, c.conta, botao, opcoes[0]?.v);
  abrirModal(`${c.nome || c.conta}: ${jogoDe(c.jogo).ferramenta.escolher ?? 'Escolha'}`,
    opcoes.map((o, i) => `<button data-escolha="${i}">${esc(o.rot)}</button>`).join(''), true);
  $('#modal-corpo').onclick = (e) => {
    const op = e.target.closest('[data-escolha]');
    if (op && !op.disabled) abrirFerramenta(c.jogo, c.conta, op, opcoes[op.dataset.escolha].v);
  };
  modal = 'escolha';
  layout();
}

// A ferramenta do jogo abre em modal por cima do painel; fechar volta tudo como estava
async function abrirFerramenta(jogo, conta, botao, escolha) {
  const rotulo = botao?.textContent;
  if (botao && conta) { botao.disabled = true; botao.textContent = 'Preparando...'; }
  const ok = await window.api.ferramenta(jogo, conta, escolha);
  if (botao && conta) { botao.disabled = false; botao.textContent = rotulo; }
  if (!ok && conta) alert('Não consegui pegar os dados desta conta. Abra a conta e tente de novo.');
  abrirModal(jogoDe(jogo)?.ferramenta.titulo ?? '', '', false);
  modal = '__ferramenta:' + jogo;
  layout();
}

// O mesmo modal serve à ferramenta (página desenhada por cima do corpo) e ao apoio (HTML daqui)
function abrirModal(titulo, html, pequeno) {
  $('#modal-titulo').textContent = titulo;
  $('#modal-corpo').innerHTML = html;
  $('#modal').classList.toggle('pequeno', pequeno);
  $('#modal').classList.remove('lives', 'depot', 'sniper', 'compras');
  $('#modal-corpo').onclick = null; // o clique do modal anterior (ex.: Depot) não vale para o próximo
}

// Lives da Twitch: o programa abre/fecha/reconecta; aqui só mostra e liga/desliga
let estadoLives = { ligado: false, abertas: [], semConta: false, max: 4, limite: 12 };
function desenharLives() {
  const l = estadoLives;
  const aviso = l.semConta ? 'Nenhuma conta com a Twitch vinculada no jogo (botão "Conectar Twitch" do jogo).'
    : !l.ligado ? 'Ligue para o Multidle manter abertas as lives oficiais com bônus e reconectar quando caírem.'
    : !l.abertas.length ? 'Procurando lives oficiais no ar (o jogo é consultado a cada 2 minutos)...'
    : 'Sem som e em 160p. Fechar esta janela não fecha as lives.';
  const entrar = l.entrando
    ? '<span class="pos">Faça login na Twitch no navegador que abriu e depois FECHE a janela dele: o login vem para cá.</span>'
    : l.usuario
    ? `<span class="pos">Logado na Twitch como <b>${esc(l.usuario)}</b></span><button id="lives-entrar" title="Entrar com outra conta da Twitch">Trocar conta</button>`
    : '<button id="lives-entrar" title="A Twitch bloqueia login dentro de apps: o login é feito no Chrome/Edge e copiado para cá">Entrar na Twitch</button>';
  const quantas = `<label title="Cada live gasta ~250 MB de RAM e ~1,3% de CPU; cada uma a mais dá +2,5% de XP">Até `
    + `<input type="number" id="lives-max" min="1" max="${esc(l.limite)}" value="${esc(l.max)}" style="width:52px"> lives</label>`;
  const soChat = `<label title="Abre só o chat de cada live (o jogo detecta pela presença no chat): bem menos memória, sem vídeo">`
    + `<input type="checkbox" id="lives-so-chat" ${l.soChat ? 'checked' : ''}> Só o chat (mais leve)</label>`;
  abrirModal('Lives da Twitch', `<div class="lives-barra"><label><input type="checkbox" id="lives-ligado" ${l.ligado ? 'checked' : ''}> Manter as lives abertas</label>${soChat}${quantas}${entrar}<span>${esc(aviso)}</span></div>`
    + `<div class="lives-grade">${l.abertas.map((v) => `<div class="live"><div class="live-cab"><span>${esc(v.nome || v.login)}</span>`
      + `<span class="${v.aqui ? 'pos' : 'fraco'}">${v.aqui ? '✓ o jogo te detectou' : 'aguardando o jogo detectar...'}</span></div>`
      + `<div class="live-corpo" data-live="${esc(v.login)}"></div></div>`).join('')}</div>`, false);
  $('#modal').classList.add('lives');
  $('#lives-ligado').onchange = (e) => window.api.livesLigar(e.target.checked);
  $('#lives-entrar')?.addEventListener('click', () => window.api.livesEntrar());
  $('#lives-so-chat').onchange = (e) => window.api.livesSoChat(e.target.checked);
  $('#lives-max').onchange =(e) => window.api.livesMax(Math.min(l.limite, Math.max(1, Number(e.target.value) || l.max)));
  modal = 'lives';
  layout();
}
window.api.aoLives((l) => { estadoLives = l; $('#lives').hidden = !l.disponivel; if (modal === 'lives') desenharLives(); });
window.api.livesPedir();
$('#lives').onclick = () => { desenharLives(); window.api.livesPedir(); };

// Sniper do Mercado: o programa vigia e compra; aqui só configura e mostra o registro.
// A tabela é desenhada ao abrir; as atualizações só trocam o menor preço, o gasto e o registro
// (redesenhar tudo apagaria o que a pessoa está digitando)
let estadoSniper = null;
const hora = (t) => new Date(t).toLocaleTimeString('pt-BR');
function atualizarSniper() {
  const s = estadoSniper;
  if (modal !== 'sniper' || !s) return;
  for (const a of s.cfg.alvos) {
    const el = document.querySelector(`[data-menor="${CSS.escape(a.id)}"]`);
    if (el) el.innerHTML = a.erro ? `<span class="neg">${esc(a.erro)}</span>`
      : a.visto ? `${a.menor == null ? "nenhum anúncio" : num(a.menor)} <span class="fraco">às ${hora(a.visto)}</span>` : '<span class="fraco">—</span>';
    const h = document.querySelector(`[data-hoje="${CSS.escape(a.id)}"]`);
    if (h) h.textContent = `${s.gasto.alvo[a.id] ?? 0}/${a.maxDia}`;
  }
  const contas = Object.entries(s.gasto.conta).map(([id, v]) => `${esc(s.nomes?.[id] ?? id)}: ${num(Math.round(v))}`).join(' · ');
  $('#sniper-gasto').innerHTML = `Gasto hoje${s.cfg.simulacao ? ' (simulação)' : ''}, em Gemas: ${contas || 'nada'}`;
  mostrarHistorico();
}
// Histórico com filtro (o programa filtra; aqui só desenha). O filtro fica guardado entre aberturas.
const TIPOS_HIST = { tentativas: 'Todas as tentativas', comprado: '✅ Comprado', perdido: '❌ Perdido', tentando: '⏳ Aguardando resultado',
  erro: '⚠ Não passou / erro', simulado: '🧪 Simulado', 'sem-saldo': 'Sem saldo/teto', config: 'Ligar/desligar' };
const filtroHist = { conta: '', tipo: '', de: '', ate: '' };
const quando = (t) => new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
async function mostrarHistorico() {
  const linhas = await window.api.sniperRegistro({ conta: filtroHist.conta, tipo: filtroHist.tipo,
    de: filtroHist.de ? new Date(filtroHist.de).getTime() : 0, ate: filtroHist.ate ? new Date(filtroHist.ate).getTime() : 0 });
  const caixa = $('#sniper-registro');
  if (!caixa) return;
  const quantos = (tipo) => linhas.filter((l) => l.tipo === tipo).length;
  $('#sn-contagem').textContent = `${linhas.filter((l) => l.anuncio).length} tentativas · ${quantos('comprado')} comprados · ${quantos('perdido')} perdidos`
    + (quantos('tentando') ? ` · ${quantos('tentando')} aguardando` : '');
  caixa.innerHTML = linhas.length
    ? `<table class="depot"><tr><th>Quando</th><th>Conta</th><th>Resultado</th><th>Item</th></tr>${linhas.map((l) =>
      `<tr><td>${quando(l.em)}</td><td>${esc(l.conta ?? '')}</td><td>${esc(l.detalhe ?? '')}</td><td>${esc(l.texto)}</td></tr>`).join('')}</table>`
    : 'Nada com esse filtro.';
}
function desenharSniper() {
  const s = estadoSniper;
  if (!s) return;
  const c = s.cfg;
  abrirModal('Sniper do Mercado', `<div class="lives-barra">
      <label><input type="checkbox" id="sn-ligado" ${c.ligado ? 'checked' : ''}> Ligado</label>
      <label title="Só registra o que compraria, sem comprar"><input type="checkbox" id="sn-sim" ${c.simulacao ? 'checked' : ''}> Modo simulação</label>
      <label title="Nunca deixa a conta abaixo deste saldo (em ouro vale × ${num(s.ouroPorGema)})">Saldo mínimo <input type="number" id="sn-saldo" min="0" value="${esc(c.saldoMinimo)}" style="width:70px"> Gemas</label>
      <label title="Máximo que cada conta gasta por dia (ouro conta convertido)">Teto/dia por conta <input type="number" id="sn-teto" min="0" value="${esc(c.tetoDiaConta)}" style="width:70px"> Gemas</label>
    </div>
    <div class="fraco">Cada anúncio é disputado por UMA conta só (a com mais saldo). Consulta a cada ${esc(c.intervaloS)} s, revezando as contas.</div>
    <div class="lives-barra"><button id="sn-ativar-todos">Ativar todos</button><button id="sn-desativar-todos">Desativar todos</button></div>
    <table class="depot"><tr><th></th><th>Alvo</th><th>Moeda</th><th>Conta</th><th>Preço máx.</th><th>Máx./dia</th><th>Hoje</th><th>Menor no Mercado</th></tr>
    ${c.alvos.map((a) => `<tr data-alvo="${esc(a.id)}"><td><input type="checkbox" data-campo="ativo" ${a.ativo ? 'checked' : ''}></td>
      <td data-nome-alvo="${esc(a.id)}">${esc(a.nome)}</td><td>${esc(s.moedas[a.moeda] ?? a.moeda)}</td>
      <td><select data-campo="conta" title="Qual conta compra este alvo"><option value="">Qualquer conta</option>${Object.entries(s.nomes ?? {}).map(([id, n]) =>
        `<option value="${esc(id)}" ${a.conta === id ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></td>
      <td><input type="number" min="0" data-campo="precoMax" value="${esc(a.precoMax)}"></td>
      <td><input type="number" min="0" data-campo="maxDia" value="${esc(a.maxDia)}" style="width:60px"></td>
      <td data-hoje="${esc(a.id)}"></td><td data-menor="${esc(a.id)}"></td>
      <td><button data-remover="${esc(a.id)}" title="Remover este alvo">&#x2715;</button></td></tr>`).join('')}</table>
    <div id="sn-novo" class="lives-barra"><button id="sn-adicionar">+ Adicionar alvo</button>${window.api.sniperPrecos ? '<button id="sn-precos" title="Menor e maior preço visto no Mercado em cada dia">Preços por dia</button>' : ''}</div>
    <div class="depot-rodape"><span id="sniper-gasto" class="fraco"></span><button id="sn-zerar" title="Zera o gasto e a quantidade comprada hoje em cada alvo">Zerar contagem de hoje</button></div>
    <div class="depot-rodape"><span class="fraco">Histórico (mais recente em cima) · <span id="sn-contagem"></span></span><span><button id="sn-historico" title="Abre o arquivo com todas as tentativas">Abrir histórico completo</button> <button id="sn-limpar" title="Apaga o histórico da tela e do arquivo">Limpar</button></span></div>
    <div class="lives-barra" id="sn-filtro">
      <select data-f="conta"><option value="">Todas as contas</option>${Object.values(s.nomes ?? {}).map((n) => `<option ${filtroHist.conta === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <select data-f="tipo"><option value="">Todos os tipos</option>${Object.entries(TIPOS_HIST).map(([k, n]) => `<option value="${k}" ${filtroHist.tipo === k ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <label>De <input type="datetime-local" data-f="de" value="${esc(filtroHist.de)}"></label>
      <label>Até <input type="datetime-local" data-f="ate" value="${esc(filtroHist.ate)}"></label>
      <button id="sn-filtro-limpar">Limpar filtro</button>
    </div>
    <div id="sniper-registro" class="sniper-registro"></div>`, false);
  $('#modal').classList.add('sniper');
  modal = 'sniper';
  $('#sn-ligado').onchange = (e) => window.api.sniperSalvar({ ligado: e.target.checked });
  $('#sn-sim').onchange = (e) => {
    if (!e.target.checked && !confirm('Desligar a simulação faz o sniper COMPRAR de verdade com as suas contas. Continuar?')) return void (e.target.checked = true);
    window.api.sniperSalvar({ simulacao: e.target.checked });
  };
  $('#sn-saldo').onchange = (e) => window.api.sniperSalvar({ saldoMinimo: e.target.value });
  $('#sn-teto').onchange = (e) => window.api.sniperSalvar({ tetoDiaConta: e.target.value });
  // os alvos como estão na tabela (com o que a pessoa já digitou)
  const lerTabela = () => estadoSniper.cfg.alvos.map((a) => {
    const v = (campo) => document.querySelector(`tr[data-alvo="${CSS.escape(a.id)}"] [data-campo="${campo}"]`);
    return { ...a, ativo: v('ativo').checked, precoMax: v('precoMax').value, maxDia: v('maxDia').value, conta: v('conta').value };
  });
  const salvarERedesenhar = (alvos) => { redesenharSniper = true; window.api.sniperSalvar({ alvos }); };
  $('#modal-corpo').onchange = (e) => {
    if (e.target.dataset.campo) window.api.sniperSalvar({ alvos: lerTabela() });
  };
  $('#modal-corpo').onclick = (e) => {
    const id = e.target.dataset?.remover;
    if (id) salvarERedesenhar(lerTabela().filter((a) => a.id !== id));
  };
  const marcarTodos = (ativo) => {
    document.querySelectorAll('tr[data-alvo] [data-campo="ativo"]').forEach((x) => { x.checked = ativo; });
    window.api.sniperSalvar({ alvos: lerTabela() });
  };
  $('#sn-ativar-todos').onclick = () => marcarTodos(true);
  $('#sn-desativar-todos').onclick = () => marcarTodos(false);
  $('#sn-historico').onclick = () => window.api.sniperHistorico();
  if ($('#sn-precos')) $('#sn-precos').onclick = () => desenharPrecos(); // só depois de reinstalar (precisa do main.js novo)
  // Dica no nome de cada alvo: menor e maior do Mercado nos últimos 7 dias
  window.api.sniperPrecos?.().then((precos) => {
    const dias = Object.keys(precos).sort().reverse().slice(0, 7);
    for (const el of document.querySelectorAll('[data-nome-alvo]')) {
      const vistos = dias.filter((d) => precos[d][el.dataset.nomeAlvo]).map((d) => {
        const p = precos[d][el.dataset.nomeAlvo];
        return `${d.split('-').reverse().slice(0, 2).join('/')}: menor ${num(p.min)} · maior ${num(p.max)}`;
      });
      el.title = vistos.length ? `Mercado por dia\n${vistos.join('\n')}` : 'Sem preços anotados ainda (só alvos ativos)';
      el.style.cursor = 'help';
    }
  });
  $('#sn-filtro').onchange = (e) => { if (e.target.dataset.f) { filtroHist[e.target.dataset.f] = e.target.value; mostrarHistorico(); } };
  $('#sn-filtro-limpar').onclick = () => { Object.assign(filtroHist, { conta: '', tipo: '', de: '', ate: '' }); desenharSniper(); };
  $('#sn-zerar').onclick = () => { if (confirm('Zerar o gasto e a quantidade de hoje? O sniper volta a poder comprar até os limites.')) window.api.sniperZerarDia(); };
  $('#sn-limpar').onclick = () => { if (confirm('Apagar todo o histórico do sniper?')) window.api.sniperLimpar(); };
  $('#sn-adicionar').onclick = async (e) => {
    e.target.disabled = true;
    e.target.textContent = 'Lendo o Mercado...';
    const r = await window.api.sniperCatalogo();
    if (r.erro) return void ($('#sn-novo').innerHTML = `<span class="neg">${esc(r.erro)}</span>`);
    const menor = (i) => [i.minOrb != null && `${num(i.minOrb)} Gemas`, i.minGold != null && `${num(i.minGold)} ouro`].filter(Boolean).join(' · ');
    $('#sn-novo').innerHTML = `<select id="sn-item"><option value="shiny">✨ Qualquer shiny</option><option value="diamante">💎 Diamantes (preço por diamante)</option>${r.itens.map((i) =>
      `<option value="${i.itemId}">${esc(i.nome)} (agora: ${esc(menor(i))})</option>`).join('')}</select>
      <select id="sn-moeda">${Object.entries(s.moedas).map(([k, n]) => `<option value="${esc(k)}">${esc(n)}</option>`).join('')}</select>
      <label>Preço máx. <input type="number" id="sn-preco" min="0" style="width:110px"></label>
      <label>Máx./dia <input type="number" id="sn-maxdia" min="1" value="1" style="width:60px"></label>
      <button id="sn-confirmar">Adicionar</button>`;
    $('#sn-confirmar').onclick = () => {
      const item = $('#sn-item').value;
      const moeda = $('#sn-moeda').value;
      const especial = { shiny: 'Qualquer shiny', diamante: 'Diamantes' }[item];
      const nome = especial ?? r.itens.find((i) => String(i.itemId) === item).nome;
      if (!(Number($('#sn-preco').value) > 0)) return void $('#sn-preco').focus();
      salvarERedesenhar([...lerTabela(), { id: `${item}-${moeda}-${Date.now().toString(36)}`, tipo: especial ? item : 'item',
        itemId: especial ? undefined : Number(item), nome, moeda, precoMax: $('#sn-preco').value, maxDia: $('#sn-maxdia').value, ativo: true }]);
    };
  };
  layout();
  atualizarSniper();
}
// Menor e maior preço do Mercado por dia (o programa anota a cada consulta do sniper), filtro por alvo
let filtroPrecos = '';
async function desenharPrecos() {
  const precos = await window.api.sniperPrecos();
  const linhas = Object.entries(precos).sort(([a], [b]) => b.localeCompare(a))
    .flatMap(([dia, alvos]) => Object.entries(alvos).map(([id, p]) => ({ dia, id, ...p })));
  const alvos = new Map(linhas.map((l) => [l.id, `${l.nome} · ${estadoSniper?.moedas[l.moeda] ?? l.moeda}`]));
  const vistas = linhas.filter((l) => !filtroPrecos || l.id === filtroPrecos);
  const dia = (d) => d.split('-').reverse().join('/');
  abrirModal('Preços por dia', `<div class="lives-barra"><button id="pr-voltar">← Sniper</button>
      <select id="pr-alvo"><option value="">Todos os alvos</option>${[...alvos].map(([id, n]) => `<option value="${esc(id)}" ${filtroPrecos === id ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <span class="fraco">Anúncios abertos vistos pelo sniper (só alvos ativos)</span></div>
    <div class="sniper-registro">${vistas.length ? `<table class="depot"><tr><th>Dia</th><th>Alvo</th><th>Moeda</th><th>Menor</th><th>Maior</th></tr>${vistas.map((l) =>
      `<tr><td>${dia(l.dia)}</td><td>${esc(l.nome)}</td><td>${esc(estadoSniper?.moedas[l.moeda] ?? l.moeda)}</td><td>${num(l.min)}</td><td>${num(l.max)}</td></tr>`).join('')}</table>`
      : 'Nada anotado ainda: os preços aparecem depois das consultas do sniper ligado.'}</div>`, false);
  $('#modal').classList.add('sniper');
  modal = 'precos';
  $('#pr-voltar').onclick = () => desenharSniper();
  $('#pr-alvo').onchange = (e) => { filtroPrecos = e.target.value; desenharPrecos(); };
  layout();
}
let redesenharSniper = false; // depois de adicionar/remover, a tabela é desenhada de novo com o que o programa salvou
window.api.aoSniper((s) => {
  estadoSniper = s;
  $('#sniper').classList.toggle('pos', s.cfg.ligado);
  if (redesenharSniper && modal === 'sniper') { redesenharSniper = false; desenharSniper(); } else atualizarSniper();
});
window.api.sniperPedir();
$('#sniper').onclick = () => { window.api.sniperPedir(); desenharSniper(); };

// Aviso verde na barra de cima por alguns segundos (compra do sniper, venda do Depot...)
let tempoNotificacao = 0;
function notificar(texto, ms = 10000) {
  const el = $('#notificacao');
  el.textContent = texto;
  el.title = texto;
  el.hidden = false;
  clearTimeout(tempoNotificacao);
  tempoNotificacao = setTimeout(() => { el.hidden = true; }, ms);
}
$('#notificacao').onclick = () => { $('#notificacao').hidden = true; };

// Compras do Sniper: aviso na hora e o sino com as que ainda não foram vistas
let comprasNaoVistas = 0;
const mostrarSino = () => { $('#compras-n').hidden = !comprasNaoVistas; $('#compras-n').textContent = comprasNaoVistas; };
const precoDaCompra = (l) => (l.preco != null ? `${l.preco.toLocaleString('pt-BR')} ${l.moeda}` : '');
window.api.sniperCompras().then(({ compras, vistoEm }) => {
  comprasNaoVistas = compras.filter((l) => (l.mudouEm ?? l.em) > vistoEm).length;
  mostrarSino();
});
window.api.aoSniperComprado((l) => {
  comprasNaoVistas++;
  mostrarSino();
  notificar(`✅ Comprado: ${l.item ? `${l.qtd}× ${l.item} por ${precoDaCompra(l)}` : l.texto}${l.conta ? ` · ${l.conta}` : ''}`);
  if (modal === 'compras') abrirCompras();
});
async function abrirCompras() {
  const { compras } = await window.api.sniperCompras();
  const quando = (l) => new Date(l.mudouEm ?? l.em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  // compras antigas ou feitas à mão no jogo só têm o texto
  const linhas = compras.map((l) => `<tr><td>${esc(quando(l))}</td><td>${esc(l.conta ?? '')}</td><td>${esc(l.item ?? l.texto)}</td>`
    + `<td>${l.qtd ?? '—'}</td><td>${esc(precoDaCompra(l) || '—')}</td>`
    + `<td>${l.preco != null ? esc(`${(l.preco * l.qtd).toLocaleString('pt-BR')} ${l.moeda}`) : '—'}</td></tr>`).join('');
  abrirModal('Compras do Sniper', compras.length
    ? `<table class="depot"><thead><tr><th>Quando</th><th>Conta</th><th>Item</th><th>Qtd</th><th>Preço un.</th><th>Total</th></tr></thead><tbody>${linhas}</tbody></table>`
    : '<div class="fraco">Nenhuma compra do Sniper ainda.</div>', false);
  $('#modal').classList.add('compras');
  modal = 'compras';
  layout();
  comprasNaoVistas = 0;
  mostrarSino();
  window.api.sniperComprasVisto();
}
$('#compras').onclick = abrirCompras;

$('#apoiar').onclick = () => {
  const pix = APOIO.pix
    ? `<div class="pix-qr">${APOIO.pixQr}</div><div class="fraco" style="text-align:center">Aponte a câmera do app do banco · você escolhe o valor</div>`
      + `<div class="pix"><code>${esc(APOIO.pix)}</code><button data-copiar="${esc(APOIO.pix)}">Copiar chave</button></div>`
      + `<button data-copiar="${esc(APOIO.pixCopiaECola)}">Copiar "Pix copia e cola"</button>`
    : '<div class="fraco">Chave Pix em breve.</div>';
  // Ferramentas de outros autores que o Multidle usa: quem gosta pode apoiar direto
  const terceiros = jogos.flatMap((g) => g.apoioTerceiros ?? [])
    .map((t) => `<div><a href="${esc(t.url)}" target="_blank">${esc(t.nome)}</a> <span class="fraco">· ${esc(t.obs)}</span></div>`).join('');
  abrirModal('Apoie o Multidle', '<div>O Multidle é <b>gratuito e open source</b>. Se ele te ajuda e você quiser apoiar, '
    + 'qualquer valor ajuda a manter o projeto. É opcional e não libera nada a mais.</div>'
    + `<div class="apoio-caixa"><h4>Pix</h4>${pix}</div>`
    + `<div class="apoio-caixa"><h4>GitHub Sponsors</h4><a href="${esc(APOIO.sponsors)}" target="_blank">github.com/sponsors/Gustavoabreu94</a></div>`
    + (terceiros ? `<div class="apoio-caixa"><h4>Quem faz as ferramentas que o Multidle usa</h4><div class="apoio-links">${terceiros}</div></div>` : '')
    + `<div class="fraco">Código, sugestões e problemas: <a href="${esc(APOIO.repositorio)}" target="_blank">github.com/Gustavoabreu94/multidle</a></div>`, true);
  for (const b of document.querySelectorAll('#modal-corpo [data-copiar]')) {
    b.onclick = async () => { await navigator.clipboard.writeText(b.dataset.copiar); b.textContent = 'Copiado!'; };
  }
  modal = 'apoio';
  layout();
};
$('#modal-fechar').onclick = () => { modal = null; layout(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal) { modal = null; layout(); } });

document.querySelectorAll('[data-jan]').forEach((b) => { b.onclick = () => window.api.janela(b.dataset.jan); });

// Versão nova já baixada em segundo plano: um clique reinicia atualizado
window.api.aoAtualizacao((versao) => {
  const b = $('#atualizar');
  b.hidden = false;
  b.innerHTML = `&#x2B06; Atualizar para ${esc(versao)}`;
  b.title = 'A versão nova já foi baixada. Clique para reiniciar o Multidle atualizado (as contas continuam logadas).';
  b.onclick = () => { b.disabled = true; b.textContent = 'Atualizando...'; window.api.instalarAtualizacao(); };
});
window.api.aoMaximizar((m) => { document.querySelector('[data-jan="max"]').innerHTML = m ? '&#x2750;' : '&#x2610;'; });

window.api.jogos().then((j) => {
  jogos = j;
  // Um botão de nova conta por jogo (com um jogo só, fica "+ Nova conta")
  $('#novas').innerHTML = jogos.map((g) => `<button data-nova="${esc(g.id)}">+ ${jogos.length > 1 ? esc(g.nome) : 'Nova conta'}</button>`).join('');
  $('#novas').onclick = (e) => { const b = e.target.closest('[data-nova]'); if (b) window.api.nova(b.dataset.nova); };
  window.api.aoReceberDados((d) => { contas = d; render(); });
  window.addEventListener('resize', layout);
  window.api.atualizar();
});
</script>
</body>
</html>
