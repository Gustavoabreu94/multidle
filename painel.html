<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https:">
<title>Multidle</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px system-ui;background:#1f1523;color:#f3e9f5;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;background:#9b4dca;color:#fff;border:0;border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{background:#b06ee0}
button:disabled{opacity:.4;cursor:not-allowed;background:#9b4dca}

/* Barra própria no lugar da moldura do Windows: arrasta a janela, botões não */
header{display:flex;align-items:center;gap:8px;height:36px;padding-left:12px;background:#160f19;-webkit-app-region:drag;flex:none}
header button{-webkit-app-region:no-drag}
.titulo{font-weight:700;color:#c9a8d4;margin-right:8px}
.acoes{display:flex;gap:6px;flex:1}
.ctl{display:flex;height:100%}
.ctl button{background:none;border-radius:0;width:46px;height:100%;color:#c9a8d4;font-size:14px}
.ctl button:hover{background:#2f2134}
.ctl .x:hover{background:#c42b3c;color:#fff}

main{flex:1;min-height:0;padding:8px}
#t{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px}
.inicio{grid-column:1/-1;margin:auto;text-align:center;color:#a98bb3;line-height:1.6}
.card{background:#2f2134;border:1px solid #4a3550;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.card.fechado{cursor:pointer}
.card.fechado:hover{border-color:#b06ee0;background:#382740}
.topo{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 12px;flex:none}
.nome{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.jogo{font-size:11px;color:#a98bb3;font-weight:400}
.tempo{color:#a98bb3;font-variant-numeric:tabular-nums}
.card.alerta{border-color:#e0475a;box-shadow:0 0 0 1px #e0475a inset}
.estado{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;white-space:nowrap}
.estado::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
.estado.ok{color:#6ee08a}.estado.aviso{color:#ffd166}.estado.alerta{color:#ff6b7a}
.estado .extra{color:#a98bb3;font-weight:400}
.bts{display:flex;gap:4px}
.bts button{padding:2px 8px;background:#4a3550}
.bts button:hover{background:#9b4dca}
.bts .remover:hover{background:#c42b3c}
.corpo{flex:1;min-height:0;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px;overflow:auto}

.linha-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.sub-t{color:#c9a8d4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selos{display:flex;gap:6px;flex:none}
.selo{font-size:12px;color:#a98bb3;background:#1d1421;border:1px solid #4a3550;border-radius:6px;padding:1px 7px;white-space:nowrap}
.selo b{font-variant-numeric:tabular-nums}
.selo.ouro b{color:#ffd166}.selo.diam b{color:#7fd7ff}.selo.gema b{color:#ff7bd5}

/* Blocos no estilo dos jogos: rótulo pequeno, valor grande, ritmo por hora colorido */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:6px}
.kpi,.bloco{background:#1d1421;border:1px solid #4a3550;border-radius:8px;padding:6px 9px;min-width:0}
.kpi .rot,.bloco h4{margin:0;color:#c9a8d4;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.kpi .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .h{font-size:12px;font-weight:700;color:#ff7bb0;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11px;color:#a98bb3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neg{color:#ff6b7a !important}.pos{color:#6ee08a !important}

.blocos{display:grid;gap:6px}
.bloco h4{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#2f2134;border:1px solid #4a3550;border-radius:999px;padding:2px 8px;font-size:12px;white-space:nowrap}
.chip b{color:#ffd166;font-variant-numeric:tabular-nums}
.item{display:inline-flex;align-items:center;gap:4px;background:#2f2134;border:1px solid #4a3550;border-radius:6px;padding:2px 7px 2px 3px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.item img{width:20px;height:20px;image-rendering:pixelated}
.item.destaque{border-color:#9b4dca}
.item.apagado{opacity:.35}
.linha{display:flex;justify-content:space-between;gap:6px;font-size:12px;padding:1px 0}
.linha span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha .fraco{color:#a98bb3;font-variant-numeric:tabular-nums;flex:none}
.linha.destaque,.linha.destaque .fraco{color:#ffd166;font-weight:700}
.vazio{color:#7d6585;font-size:12px}
.aviso{margin:auto;text-align:center;color:#a98bb3;display:flex;flex-direction:column;gap:8px;align-items:center}

/* Ferramenta do jogo em modal por cima do painel (a página da ferramenta é desenhada em #modal-corpo) */
#fundo{position:fixed;inset:36px 0 0 0;background:rgba(10,6,12,.7);display:flex;align-items:center;justify-content:center}
#fundo[hidden]{display:none}
#modal{width:min(1200px,92%);height:90%;background:#160f19;border:1px solid #9b4dca;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#modal-cab{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;flex:none;border-bottom:1px solid #4a3550}
#modal-titulo{flex:1;font-weight:700;color:#c9a8d4}
#modal-corpo{flex:1;min-height:0}
#modal.pequeno{width:min(480px,92%);height:auto;max-height:90%}
#modal.pequeno #modal-corpo{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;line-height:1.5}

.apoiar{background:none;color:#ff7bb0;border:1px solid #4a3550;margin-right:6px}
.apoiar:hover{background:#2f2134}
.apoio-caixa{background:#1d1421;border:1px solid #4a3550;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.apoio-caixa h4{margin:0;color:#c9a8d4;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.pix{display:flex;gap:6px;align-items:center}
.pix-qr svg{display:block;width:170px;height:170px;margin:0 auto;border-radius:6px}
.pix code{flex:1;background:#2f2134;border-radius:6px;padding:4px 8px;font-size:12px;word-break:break-all}
.apoio-links{display:flex;flex-direction:column;gap:4px}
a{color:#b48cff}
.fraco{color:#a98bb3;font-size:12px}
</style>
</head>
<body>
<header>
  <span class="titulo">Multidle</span>
  <span class="acoes">
    <button id="voltar" hidden>← Painel</button>
    <button id="todas">Mostrar todas</button>
    <button id="esconder">Esconder todas</button>
    <span id="novas" class="acoes" style="flex:none"></span>
  </span>
  <button id="apoiar" class="apoiar" title="Apoie o Multidle (opcional)">&#x2665; Apoiar</button>
  <span class="ctl">
    <button data-jan="min" title="Minimizar">&#x2013;</button>
    <button data-jan="max" title="Maximizar">&#x2610;</button>
    <button data-jan="fechar" class="x" title="Fechar">&#x2715;</button>
  </span>
</header>
<main id="area"><div id="t"></div></main>
<div id="fundo" hidden><div id="modal"><div id="modal-cab"><span id="modal-titulo"></span><button id="modal-fechar" title="Fechar">&#x2715;</button></div><div id="modal-corpo"></div></div></div>
<script>
// Cartão que cada módulo de jogo devolve (jogos/*.js, função montar):
// { nome, subtitulo, tempo, estado?: {texto, nivel: ok|aviso|alerta, extra}, alerta, selos: [{rot, v, cor}], kpis: [{rot, v, h, sub, cor}],
//   blocos: [{titulo, largo?, vazio?, etiqueta?: {rot, n}, itens?: [{ico, n, nome, destaque?, apagado?}],
//             linhas?: [{esq, meio?, dir, destaque?}]}], pronto, ferramenta }
// Apoio (opcional): troque `pix` pela chave do projeto (de preferência aleatória)
const APOIO = {
  pix: '340355d9-a9f1-4b9c-927d-190c4cbe1a12',
  // Pix estático (BR Code) dessa chave, sem valor: copia e cola e o QR (gerados uma vez; a chave não muda)

0h5m1 0h5m1 0h4m2 0h1m2 0h5m4 0h1m1 0h5M3 29.5h1m1 0h2m2 0h1m1 0h3m1 0h1m4 0h1m4 0h3m3 0h2m2 0h1m2 0h1m3 0h1M2 30.5h3m1 0h6m2 0h1m1 0h2m1 0h2m2 0h1m1 0h2m3 0h1m1 0h1m2 0h4m1 0h2M2 31.5h1m1 0h3m2 0h1m1 0h2m6 0h1m2 0h1m1 0h6m1 0h1m3 0h1m2 0h3m1 0h1M2 32.5h1m1 0h2m2 0h1m2 0h2m1 0h3m2 0h1m1 0h1m2 0h1m1 0h2m1 0h1m1 0h2m7 0h3M2 33.5h1m4 0h1m3 0h2m1 0h2m1 0h1m2 0h3m1 0h1m2 0h1m1 0h1m2 0h1m3 0h1m1 0h1M2 34.5h1m1 0h3m1 0h3m1 0h6m3 0h1m2 0h2m2 0h1m3 0h10M10 35.5h2m4 0h9m3 0h1m1 0h1m2 0h2m3 0h1m1 0h1M2 36.5h7m4 0h7m1 0h3m2 0h2m2 0h1m1 0h1m1 0h1m1 0h1m1 0h1m2 0h1M2 37.5h1m5 0h1m1 0h2m1 0h1m2 0h1m2 0h2m2 0h2m1 0h2m3 0h2m1 0h1m3 0h1m1 0h2M2 38.5h1m1 0h3m1 0h1m1 0h1m1 0h1m1 0h1m3 0h1m3 0h2m3 0h5m1 0h8M2 39.5h1m1 0h3m1 0h1m1 0h2m1 0h1m2 0h1m1 0h3m3 0h1m1 0h1m1 0h1m5 0h2m2 0h1m1 0h2M2 40.5h1m1 0h3m1 0h1m1 0h1m2 0h1m1 0h4m1 0h2m3 0h3m1 0h1m1 0h6m1 0h1m1 0h2M2 41.5h1m5 0h1m2 0h2m1 0h1m1 0h5m3 0h1m3 0h1m4 0h1m1 0h1m1 0h2M2 42.5h7m1 0h1m3 0h1m3 0h4m1 0h3m4 0h3m1 0h2m1 0h5"/></svg>',
  sponsors: 'https://github.com/sponsors/Gustavoabreu94',
  repositorio: 'https://github.com/Gustavoabreu94/multidle',
};

const abertas = new Set(); // contas com o jogo visível por cima do cartão
let maximizada = null;     // conta ocupando o programa inteiro
let modal = null;          // ferramenta aberta em modal ('__ferramenta:<jogo>')
let contas = [];
let jogos = [];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => '&#' + c.charCodeAt(0) + ';');
const num = (n) => Number(n).toLocaleString('pt-BR');
const caixa = (r) => ({ x: Math.round(r.left), y: Math.round(r.top), width: Math.round(r.width), height: Math.round(r.height) });
const jogoDe = (id) => jogos.find((j) => j.id === id);

// Diz ao programa onde desenhar cada conta: no corpo do cartão, ou na área toda se maximizada
function layout() {
  const mapa = {};
  // Com o modal aberto só ele aparece: as contas abertas ficariam por cima dele. Elas continuam
  // marcadas como abertas e voltam do mesmo jeito ao fechar.
  $('#fundo').hidden = !modal;
  if (modal) mapa[modal] = caixa($('#modal-corpo').getBoundingClientRect());
  else if (maximizada) mapa[maximizada] = caixa($('#area').getBoundingClientRect());
  else for (const c of abertas) {
    const el = document.querySelector(`.card[data-conta="${c}"] .corpo`);
    if (el) mapa[c] = caixa(el.getBoundingClientRect());
  }
  window.api.layout(mapa);
  $('#voltar').hidden = !maximizada;
}

const kpi = (k) => `<div class="kpi"><div class="rot">${esc(k.rot)}</div><div class="v ${esc(k.cor)}">${esc(k.v)}</div>`
  + `<div class="h ${esc(k.cor)}">${esc(k.h)}</div><div class="sub">${esc(k.sub)}</div></div>`;

function bloco(b) {
  const etiqueta = b.etiqueta ? `<span class="chip">${esc(b.etiqueta.rot)} <b>${num(b.etiqueta.n)}</b></span>` : '';
  const itens = (b.itens || []).map((i) => `<span class="item ${i.destaque ? 'destaque' : ''} ${i.apagado ? 'apagado' : ''}" title="${esc(i.nome)}">`
    + `<img src="${esc(i.ico)}" alt="">${num(i.n)}</span>`).join('');
  const linhas = (b.linhas || []).map((l) => `<div class="linha ${l.destaque ? 'destaque' : ''}">`
    + `<span>${l.destaque ? '★ ' : ''}${esc(l.esq)} <span class="fraco">${esc(l.meio)}</span></span><span class="fraco">${esc(l.dir)}</span></div>`).join('');
  const conteudo = etiqueta || itens ? `<div class="chips">${etiqueta}${itens}</div>` : linhas || `<div class="vazio">${esc(b.vazio)}</div>`;
  return `<div class="bloco"><h4>${esc(b.titulo)}</h4>${conteudo}</div>`;
}

function detalhes(c) {
  const selos = (c.selos || []).map((s) => `<span class="selo ${esc(s.cor)}" title="${esc(s.rot)} (total da conta)">${esc(s.rot)} <b>${esc(s.v)}</b></span>`).join('');
  const blocos = c.blocos || [];
  const colunas = blocos.map((b) => (b.largo ? '1.4fr' : '1fr')).join(' ');
  return `<div class="linha-sub"><span class="sub-t">${esc(c.subtitulo)}</span><span class="selos">${selos}</span></div>`
    + `<div class="kpis">${(c.kpis || []).map(kpi).join('')}</div>`
    + `<div class="blocos" style="grid-template-columns:${colunas}">${blocos.map(bloco).join('')}</div>`;
}

function render() {
  // Limite de contas de cada jogo (no PokeIdle, mais de 4 bane todas)
  for (const b of document.querySelectorAll('[data-nova]')) {
    const j = jogoDe(b.dataset.nova);
    const cheio = contas.filter((c) => c.jogo === j.id).length >= j.maxContas;
    b.disabled = cheio;
    b.title = cheio ? j.avisoLimite : '';
  }
  if (!contas.length) {
    $('#t').innerHTML = '<div class="inicio">Nenhuma conta ainda.<br>Clique em <b>+ Nova conta</b>: o navegador abre para você entrar no jogo,<br>'
      + 'e a conta aparece aqui sozinha quando o login terminar.</div>';
    return layout();
  }
  $('#t').innerHTML = contas.map((c) => {
    const jogo = jogoDe(c.jogo);
    const aberta = abertas.has(c.conta);
    const corpo = c.semNavegador && !c.pronto
      ? '<div class="aviso">Para entrar é preciso o Google Chrome ou o Microsoft Edge instalado.</div>'
      : c.entrando
      ? '<div class="aviso">Faça login na janela do navegador que abriu.<br>Ela fecha sozinha quando terminar.</div>'
      : !c.pronto
      ? `<div class="aviso">Sem login ou carregando...<button data-entrar="${esc(c.conta)}">Entrar com Google</button></div>`
      : detalhes(c);
    const ferramenta = c.ferramenta && jogo?.ferramenta
      ? `<button data-ferramenta="${esc(c.conta)}" title="${esc(jogo.ferramenta.dica)}">${esc(jogo.ferramenta.rotulo)}</button>` : '';
    const acoes = c.pronto ? (jogo?.acoes ?? []).map((a) => `<button data-acao="${esc(a.id)}" data-acao-conta="${esc(c.conta)}" title="${esc(a.dica)}">${esc(a.rotulo)}</button>`).join('') : '';
    const bts = `<span class="bts">${acoes}${ferramenta}` + (aberta
      ? `<button data-max="${esc(c.conta)}" title="Ocupar o programa todo">&#x2922;</button><button data-fechar="${esc(c.conta)}" title="Esconder">&#x2013;</button>`
      : `<button class="remover" data-remover="${esc(c.conta)}" title="Remover esta conta do Multidle">&#x2715;</button>`) + '</span>';
    // Estado da caça (caçando / parado / fora / sem conexão): fora do "ok", o cartão fica com borda vermelha
    const estado = c.estado && c.pronto
      ? `<span class="estado ${esc(c.estado.nivel)}" title="Estado da caça, como o jogo mostra ao lado do relógio">${esc(c.estado.texto)}`
        + (c.estado.extra ? ` <span class="extra">· ${esc(c.estado.extra)}</span>` : '') + '</span>'
      : '';
    return `<div class="card ${aberta ? '' : 'fechado'} ${c.alerta && c.pronto ? 'alerta' : ''}" data-conta="${esc(c.conta)}" title="${aberta ? '' : 'Abrir esta conta'}">`
      + `<div class="topo"><span class="nome">${esc(c.nome || c.conta)} <span class="jogo">${esc(jogo?.nome)}</span></span>${estado}<span class="tempo">${esc(c.tempo)}</span>${bts}</div>`
      + `<div class="corpo">${corpo}</div></div>`;
  }).join('');
  layout();
}

$('#t').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b?.dataset.entrar) return window.api.entrar(b.dataset.entrar);
  if (b?.dataset.ferramenta) return abrirFerramenta(contas.find((c) => c.conta === b.dataset.ferramenta).jogo, b.dataset.ferramenta, b);
  if (b?.dataset.acao) {
    const c = contas.find((x) => x.conta === b.dataset.acaoConta);
    const a = jogoDe(c.jogo)?.acoes.find((x) => x.id === b.dataset.acao);
    if (a && (!a.confirmar || confirm(`${c.nome || c.conta}: ${a.confirmar}`))) window.api.acao(c.conta, a.id);
    return;
  }
  if (b?.dataset.max) { maximizada = b.dataset.max; return layout(); }
  if (b?.dataset.fechar) { abertas.delete(b.dataset.fechar); return render(); }
  if (b?.dataset.remover) {
    const c = contas.find((x) => x.conta === b.dataset.remover);
    if (confirm(`Remover ${c.nome || c.conta} do Multidle? O login dela neste computador é apagado (a conta no jogo não muda).`)) window.api.remover(c.conta);
    return;
  }
  const card = e.target.closest('.card.fechado');
  if (card) { abertas.add(card.dataset.conta); render(); }
});
$('#voltar').onclick = () => { maximizada = null; layout(); };
$('#todas').onclick = () => { maximizada = null; contas.forEach((c) => abertas.add(c.conta)); render(); };
$('#esconder').onclick = () => { maximizada = null; abertas.clear(); render(); };

// A ferramenta do jogo abre em modal por cima do painel; fechar volta tudo como estava
async function abrirFerramenta(jogo, conta, botao) {
  const rotulo = botao?.textContent;
  if (botao && conta) { botao.disabled = true; botao.textContent = 'Preparando...'; }
  const ok = await window.api.ferramenta(jogo, conta);
  if (botao && conta) { botao.disabled = false; botao.textContent = rotulo; }
  if (!ok && conta) alert('Não consegui pegar os dados desta conta. Abra a conta e tente de novo.');
  abrirModal(jogoDe(jogo)?.ferramenta.titulo ?? '', '', false);
  modal = '__ferramenta:' + jogo;
  layout();
}

// O mesmo modal serve à ferramenta (página desenhada por cima do corpo) e ao apoio (HTML daqui)
function abrirModal(titulo, html, pequeno) {
  $('#modal-titulo').textContent = titulo;
  $('#modal-corpo').innerHTML = html;
  $('#modal').classList.toggle('pequeno', pequeno);
}

$('#apoiar').onclick = () => {
  const pix = APOIO.pix
    ? `<div class="pix-qr">${APOIO.pixQr}</div><div class="fraco" style="text-align:center">Aponte a câmera do app do banco · você escolhe o valor</div>`
      + `<div class="pix"><code>${esc(APOIO.pix)}</code><button data-copiar="${esc(APOIO.pix)}">Copiar chave</button></div>`
      + `<button data-copiar="${esc(APOIO.pixCopiaECola)}">Copiar "Pix copia e cola"</button>`
    : '<div class="fraco">Chave Pix em breve.</div>';
  // Ferramentas de outros autores que o Multidle usa: quem gosta pode apoiar direto
  const terceiros = jogos.flatMap((g) => g.apoioTerceiros ?? [])
    .map((t) => `<div><a href="${esc(t.url)}" target="_blank">${esc(t.nome)}</a> <span class="fraco">· ${esc(t.obs)}</span></div>`).join('');
  abrirModal('Apoie o Multidle', '<div>O Multidle é <b>gratuito e open source</b>. Se ele te ajuda e você quiser apoiar, '
    + 'qualquer valor ajuda a manter o projeto. É opcional e não libera nada a mais.</div>'
    + `<div class="apoio-caixa"><h4>Pix</h4>${pix}</div>`
    + `<div class="apoio-caixa"><h4>GitHub Sponsors</h4><a href="${esc(APOIO.sponsors)}" target="_blank">github.com/sponsors/Gustavoabreu94</a></div>`
    + (terceiros ? `<div class="apoio-caixa"><h4>Quem faz as ferramentas que o Multidle usa</h4><div class="apoio-links">${terceiros}</div></div>` : '')
    + `<div class="fraco">Código, sugestões e problemas: <a href="${esc(APOIO.repositorio)}" target="_blank">github.com/Gustavoabreu94/multidle</a></div>`, true);
  for (const b of document.querySelectorAll('#modal-corpo [data-copiar]')) {
    b.onclick = async () => { await navigator.clipboard.writeText(b.dataset.copiar); b.textContent = 'Copiado!'; };
  }
  modal = 'apoio';
  layout();
};
$('#modal-fechar').onclick = () => { modal = null; layout(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal) { modal = null; layout(); } });

document.querySelectorAll('[data-jan]').forEach((b) => { b.onclick = () => window.api.janela(b.dataset.jan); });
window.api.aoMaximizar((m) => { document.querySelector('[data-jan="max"]').innerHTML = m ? '&#x2750;' : '&#x2610;'; });

window.api.jogos().then((j) => {
  jogos = j;
  // Um botão de nova conta por jogo (com um jogo só, fica "+ Nova conta")
  $('#novas').innerHTML = jogos.map((g) => `<button data-nova="${esc(g.id)}">+ ${jogos.length > 1 ? esc(g.nome) : 'Nova conta'}</button>`).join('');
  $('#novas').onclick = (e) => { const b = e.target.closest('[data-nova]'); if (b) window.api.nova(b.dataset.nova); };
  window.api.aoReceberDados((d) => { contas = d; render(); });
  window.addEventListener('resize', layout);
  window.api.atualizar();
});
</script>
</body>
</html>
