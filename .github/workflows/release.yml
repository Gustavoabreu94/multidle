# Ao enviar uma tag "vX.Y.Z", o GitHub gera o instalador do Windows e publica a release com ele.
# A versão do package.json precisa ser a mesma da tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write      # atestado de origem (prova que o .exe saiu deste código, compilado aqui)
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico e tags: as notas listam o que mudou desde a versão anterior
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Confere versão da tag
        shell: bash
        run: |
          versao="v$(node -p "require('./package.json').version")"
          [ "$versao" = "$GITHUB_REF_NAME" ] || { echo "package.json é $versao, mas a tag é $GITHUB_REF_NAME"; exit 1; }
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.exe
      # VirusTotal é opcional: só roda se o segredo VT_API_KEY estiver configurado no repositório
      - name: Envia ao VirusTotal
        id: vt
        if: ${{ env.VT_API_KEY != '' }}
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          exe=$(ls dist/*.exe)
          url=$(curl -s -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | node -p "JSON.parse(require('fs').readFileSync(0)).data")
          curl -s -H "x-apikey: $VT_API_KEY" -F "file=@$exe" "$url" > /dev/null
          echo "link=https://www.virustotal.com/gui/file/$(sha256sum "$exe" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Publica a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VT_LINK: ${{ steps.vt.outputs.link }}
        run: |
          exe=$(ls dist/*.exe)
          hash=$(sha256sum "$exe" | cut -d' ' -f1)
          nome=$(basename "$exe")
          anterior=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "### O que mudou"
            # título e tópicos de cada commit desde a versão anterior (sem as linhas de coautoria)
            git log --format='**%s**%n%b' ${anterior:+$anterior..}"$GITHUB_REF_NAME" | grep -v -i '^Co-Authored-By' | grep -v '^$' || true
            echo
            echo "### Instalação"
            echo "Quem já usa o Multidle recebe esta versão sozinho (aparece **⬆ Atualizar** na barra). Para instalar do zero, baixe o \`$nome\` abaixo."
            echo
            echo "Se o Windows mostrar \"O Windows protegeu o computador\", clique em **Mais informações** → **Executar assim mesmo** (o instalador ainda não é assinado digitalmente)."
            echo
            echo "### Segurança"
            echo "- Compilado pelo GitHub Actions a partir deste código, sem passar pelo computador de ninguém. Confira o [atestado de origem](https://github.com/$GITHUB_REPOSITORY/attestations) ou rode \`gh attestation verify \"$nome\" -R $GITHUB_REPOSITORY\`."
            echo "- SHA-256: \`$hash\` (no PowerShell: \`Get-FileHash \".\\$nome\"\`)"
            if [ -n "$VT_LINK" ]; then echo "- [Análise no VirusTotal]($VT_LINK)"; fi
          } > notas.md
          # latest.yml e .blockmap: o que a atualização automática do app consulta e baixa
          gh release create "$GITHUB_REF_NAME" "$exe" dist/*.blockmap dist/latest.yml --title "Multidle ${GITHUB_REF_NAME#v}" --notes-file notas.md
